openapi: 3.0.3
info:
  title: VALORIS API
  version: 1.0.0
servers: [{url: /api/v1}]
security: [{bearerAuth: []}]
paths:
  /projects:
    get: {summary: List tenant-scoped projects, responses: {'200': {description: OK}, '401': {description: Unauthenticated}}}
    post: {summary: Create project, responses: {'201': {description: Created}}}
  /projects/{projectId}/wbs:
    get: {summary: List project-scoped WBS nodes, responses: {'200': {description: OK}, '401': {description: Unauthenticated}, '403': {description: Project scope denied}}}
    post: {summary: Create WBS node, responses: {'201': {description: Created}, '400': {description: Invalid JSON or missing idempotency key}, '401': {description: Unauthenticated}, '403': {description: Project scope or capability denied}, '422': {description: Hierarchy validation failed}, '429': {description: Rate limited}}}
  /projects/{projectId}/baselines:
    get: {summary: List project-scoped baseline versions, responses: {'200': {description: OK}, '401': {description: Unauthenticated}, '403': {description: Project scope denied}}}
    post: {summary: Create baseline draft, responses: {'201': {description: Created}, '400': {description: Invalid JSON or missing idempotency key}, '401': {description: Unauthenticated}, '403': {description: Project scope or capability denied}, '429': {description: Rate limited}}}
  /baselines/{baselineId}/approve:
    post: {summary: Human approval; requires role, version and audit reason, responses: {'200': {description: Approved}}}
  /baselines/{baselineId}/transition:
    post: {summary: Human baseline approval or lock transition, responses: {'200': {description: Transitioned}, '400': {description: Audit reason or request invalid}, '401': {description: Unauthenticated}, '403': {description: Scope or capability denied}, '422': {description: Invalid baseline transition}, '429': {description: Rate limited}}}
  /baselines/{baselineId}/lines:
    post: {summary: Add budget line to an open baseline, responses: {'201': {description: Created}, '400': {description: Invalid JSON or missing idempotency key}, '401': {description: Unauthenticated}, '403': {description: Project scope or capability denied}, '422': {description: Budget line validation failed}, '429': {description: Rate limited}}}
  /projects/{projectId}/imports/preview:
    post: {summary: Validate import rows without committing, responses: {'200': {description: Preview result}, '400': {description: Invalid JSON}, '401': {description: Unauthenticated}, '403': {description: Project scope denied}, '422': {description: Import validation failed}, '429': {description: Rate limited}}}
  /projects/{projectId}/imports/commit:
    post: {summary: Commit a fully valid import preview, responses: {'201': {description: Imported}, '400': {description: Invalid JSON or missing idempotency key}, '401': {description: Unauthenticated}, '403': {description: Project scope or capability denied}, '422': {description: Import contains invalid rows}, '429': {description: Rate limited}}}
  /projects/{projectId}/cost-summary:
    get: {summary: Reconciled BAC/current budget/commitment/AC/ETC/EAC/VAC, responses: {'200': {description: OK}}}
  /projects/{projectId}/agent-findings:
    get: {summary: Evidence-linked findings, responses: {'200': {description: OK}}}
  /agent-findings/{findingId}/review:
    post: {summary: Human disposition; never auto-approves source data, responses: {'200': {description: Reviewed}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
